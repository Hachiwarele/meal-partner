<style>

*{box-sizing:border-box}html{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dae3da;border-radius:13px;background:#fff;color:var(--ink);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(68,126,100,.12)}textarea{min-height:83px;resize:vertical}input[type=file]{padding:9px}input[type=radio]{width:auto}a{color:var(--accent-dark)}.shell{max-width:670px;margin:0 auto;padding:19px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 1px 25px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{height:39px;width:39px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:white;font-size:21px}.brand strong{display:block;font-size:15px;letter-spacing:.09em}.brand small{color:var(--muted);font-size:11px}.mini-pill{font-size:12px;font-weight:700;color:var(--accent-dark);background:var(--pale);padding:8px 12px;border-radius:100px}.greet{font-weight:750;font-size:27px;letter-spacing:-.05em;margin:1px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 23px}.card{background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:19px;box-shadow:var(--shadow);margin-bottom:15px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 13px}.section-title h2{font-size:17px;letter-spacing:-.03em;margin:0}.label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.caption{font-size:11px;line-height:1.65;color:var(--muted)}.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750;margin-bottom .seg button.active{background:white;color:var(--accent-dark);box-shadow:0 2px 8px #1d402b13}.suggestion{width:100%;text-align:left;border:0;background:white;border-bottom:1px solid var(--line);padding:12px 2px;display:flex;align-items:center;justify-content:space-between;gap:8px}.suggestion:last-child{border:0}.suggestion.active{color:var(--accent-dark);background:#f4faf5}.suggestion small{color:var(--muted);font-size:11px}.tag{display:inline-block;background:#f0f4ed;padding:5px 9px;border-radius:20px;font-size:11px;color:#65796b}.fav-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.fav{border:1px solid #dfebe0;background:#f6faf7;border-radius:22px;font-size:12px;padding:8px 11px;color:var(--accent-dark)}.draft-row{display:flex;gap:11px;align-items:center;justify-content:space-between}.draft-row .btns{display:flex;gap:2px}.preview{background:#f1f7f1;border-radius:17px;padding:14px;margin:13px 0}.preview strong{font-size:25px}.day-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.photo{width:84px;height:84px;object-fit:cover;border-radius:13px;border:1px solid var(--line)}.photo-large{width:100%;max-height:225px;object-fit:cover;border-radius:16px}.meal-layout{display:flex;gap:12px;align-items:center}.meal-layout>div:first-child{flex:1;min-width:0}.bottom{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(16px);z-index:20;padding:8px 12px max(9px,env(safe-area-inset-bottom))}.nav{max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{border:0;background:transparent;color:#8c9b90;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px;border-radius:14px;font-size:10px;font-weight:750}.nav .ic{font-size:21px}.nav button.active{color:var(--accent-dark);background:#edf5ef}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.grid-days{display:flex;align-items:flex-end;gap:8px;height:135px;padding:8px 0 0}.daybar{display:flex;flex:1;height:100%;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}.daybar .column{width:100%;max-width:44px;min-height:4px;background:#dce9df;border-radius:8px 8px 4px 4px}.daybar .column.has{background:#81b79a}.daybar .column.today{background:#447e64}.daybar small{font-size:11px;color:var(--muted)}.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.goal{border:1px solid var(--line);text-align:left;background:#fff;border-radius:17px;padding:14px;min-height:93px}.goal.active{border:2px solid var(--accent);background:#f1f8f2}.goal strong{display:block;font-size:15px;margin:5px 0}.goal small{color:var(--muted);font-size:11px}.notice{background:#fff8ed;border:1px solid #f3e3c8;border-radius:13px;padding:12px 13px;color:#81683d;font-size:12px;line-height:1.7;margin:12px 0}.success{background:#edf7f0;color:#35684a;border:1px solid #cfe4d4}.photo-label{display:grid;place-items:center;border:1px dashed #bcd1c2;border-radius:15px;background:#f7fbf8;min-height:95px;cursor:pointer;gap:3px;padding:12px;color:var(--accent-dark);font-size:13px;text-align:center}.photo-label input{display:none}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:calc(100% - 36px);padding:12px 17px;border-radius:13px;background:#284836;color:white;box-shadow:0 8px 30px #17352830;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.right{text-align:right}.inline-note{margin-top:6px}.inline-title{margin:0 0 9px;font-size:14px}.weight-list{max-height:150px;overflow:auto}.linklike{color:var(--accent-dark);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}.range button{flex:1}.range button.active{background:var(--accent);color:white}.footer{text-align:center;font-size:11px;color:var(--muted);padding:25px 0}.hide{display:none!important}
@media(max-width:395px){.shell{padding-left:12px;padding-right:12px}.metric{padding:12px 10px}.metric-val{font-size:21px}.card{padding:15px}.two{gap:8px}.greet{font-size:24px}}
 .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{border:1px solid #d3e5d7;border-radius:20px;padding:8px 12px;background:#f8fbf8;color:#416a51;font-size:12px;font-weight:700}.chip.chosen{background:#447e64;color:white}.personal-card{border-color:#c9dfcf;background:linear-gradient(130deg,#fbfdfa,#f1f8f2)}.prompt-preview{margin-top:12px}.prompt-preview summary{cursor:pointer;font-size:12px;color:#447e64;font-weight:700}.prompt-preview textarea{margin-top:10px;min-height:210px;font-size:12px;line-height:1.5}

<body>
<div class="shell">
<header class="top"><div class="brand"><div class="brand-icon">🌱</div><div><strong>MEAL PARTNER</strong><small>食生活を、あなたらしく。</small></div></div><span class="mini-pill" id="goal-pill">減量モード</span></header>
<main id="app"><div class="card empty">データを読み込み中...</div></main>
<div class="footer">MEAL PARTNER · 個人用プロトタイプ<br>栄養値は概算です。医療・診断の代わりにはなりません。</div>
</div>
<nav class="bottom"><div class="nav" id="nav">
<button type="button" data-action="nav" data-tab="home" class="active"><span class="ic">🏠</span>ホーム</button>
<button type="button" data-action="nav" data-tab="add"><span class="ic">➕</span>食事を記録</button>
<button type="button" data-action="nav" data-tab="history"><span class="ic">📅</span>履歴</button>
<button type="button" data-action="nav" data-tab="settings"><span class="ic">⚙️</span>設定</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=(id)=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const keyOf=d=>{const yy=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${yy}-${mm}-${dd}`};
const dateLabel=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s;const a=s.split('-');return `${+a[1]}月${+a[2]}日`};
const nf=(n,d=0)=>Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const id=()=>`${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
const validNumber=v=>v===''||v===null||v===undefined?null:(Number.isFinite(Number(v))&&Number(v)>=0?Number(v):null);
const round1=n=>Math.round(n*10)/10;
const MODES={lose:{label:'減量',icon:'🌿',sub:'無理のない減量をサポート'},maintain:{label:'維持',icon:'⚖️',sub:'今の体重を健やかに維持'},gain:{label:'増量',icon:'💪',sub:'栄養を十分にとって体づくり'},health:{label:'健康管理',icon:'💚',sub:'栄養の偏りに気づく'}};
// 最初の検索用食品は「説明用の概算値」であり、公式食品成分表からの確定値ではありません。
// すべて100gあたり。調理状態・皮・製品差で栄養値は変化します。
const FOODS=[
['白米（炊飯後）',156,2.5,.3,37.1,'主食'],['玄米ごはん（炊飯後）',152,2.8,1,35.6,'主食'],['食パン',248,8.9,4.1,46.4,'主食'],['うどん（ゆで）',95,2.6,.4,21.6,'主食'],['そば（ゆで）',130,4.8,1,26,'主食'],['スパゲッティ（ゆで）',150,5.8,.9,29.2,'主食'],['オートミール（乾）',350,13.7,5.7,69.1,'主食'],
['鶏むね肉（皮なし・生）',113,24.4,1.9,0,'肉・魚'],['鶏もも肉（皮なし・生）',113,19,4,0,'肉・魚'],['牛もも肉（赤身・生）',170,21,9,0,'肉・魚'],['豚ロース（生）',248,19.3,19.2,.2,'肉・魚'],['鮭（生）',124,22.3,4.1,.1,'肉・魚'],['さば（生）',211,20.6,16.8,.3,'肉・魚'],['ツナ水煮（缶詰）',70,16,0.7,.2,'肉・魚'],
['鶏卵（全卵・生）',142,12.2,10.2,.4,'豆・卵'],['豆腐（木綿）',73,7,4.9,1.5,'豆・卵'],['納豆',184,16.5,10,12.1,'豆・卵'],['無糖ヨーグルト',56,3.6,3,4.9,'乳製品'],['普通牛乳',61,3.3,3.8,4.8,'乳製品'],['プロセスチーズ',313,22.7,26,1.3,'乳製品'],
['ブロッコリー（ゆで）',30,3.9,.4,5.2,'野菜'],['キャベツ（生）',21,1.3,.2,5.2,'野菜'],['トマト（生）',20,.7,.1,4.7,'野菜'],['にんじん（生）',35,.7,.2,9.3,'野菜'],['ほうれん草（ゆで）',23,2.6,.5,4,'野菜'],['レタス（生）',11,.6,.1,2.8,'野菜'],['きゅうり（生）',13,1,.1,3,'野菜'],
['バナナ',93,1.1,.2,22.5,'果物'],['りんご（皮なし）',53,.1,.2,15.5,'果物'],['みかん',49,.7,.1,12,'果物'],['いちご',31,.9,.1,8.5,'果物'],
['オリーブオイル',894,0,100,0,'調味料'],['マヨネーズ',668,1.5,75,4.5,'調味料'],['砂糖',391,0,0,99.3,'調味料'],['アーモンド',608,19.6,51.8,20.9,'その他'],['ミックスナッツ',620,18,55,20,'その他']
].map((a,i)=>({id:i,name:a[0],k:a[1],p:a[2],f:a[3],c:a[4],group:a[5]}));
let db,meals=[],favs=[],weights=[],settings={id:'prefs',mode:'lose',kTarget:null,pTarget:null,fTarget:null,cTarget:null,weightTarget:null};
let tab='home',method='search',draft=[],photoBlob=null,photoPreviewUrl=null,photoDisplayUrls=[],selFood=0,searchText='',day=today(),historyDay=today(),addMealDate=today(),addMealType='昼食',addMealNote='',aiRange=7,toastTimer=null;
function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open('meal-partner-local',1);req.onupgradeneeded=()=>{const d=req.result;for(const s of ['meals','favorites','weights','settings'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function storeOp(name,action,value){return new Promise((resolve,reject)=>{const tx=db.transaction(name,action==='all'?'readonly':'readwrite');const st=tx.objectStore(name);const req=action==='all'?st.getAll():action==='delete'?st.delete(value):st.put(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function refresh(){[meals,favs,weights]=await Promise.all(['meals','favorites','weights'].map(s=>storeOp(s,'all')));const ps=await storeOp('settings','all');settings=ps.find(x=>x.id==='prefs')||settings;meals.sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));weights.sort((a,b)=>a.id.localeCompare(b.id));}
function clearDisplayPhotoURLs(){for(const u of photoDisplayUrls)URL.revokeObjectURL(u);photoDisplayUrls=[]}
function photoURL(blob){if(!blob)return '';const u=URL.createObjectURL(blob);photoDisplayUrls.push(u);return u}
function render(){clearDisplayPhotoURLs();$('goal-pill').textContent=MODES[settings.mode]?.label+'モード';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='home')html=renderHome();else if(tab==='add')html=renderAdd();else if(tab==='history')html=renderHistory();else html=renderSettings();$('app').innerHTML=html;if(tab==='add'){renderSearchResults();updateSearchPreview();renderDraftPhoto()} }
function go(next){if(next==='add'&&tab!=='add'&&!draft.length)addMealDate=day;tab=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function sums(items){const v={k:0,p:0,f:0,c:0};const unknown={k:0,p:0,f:0,c:0};const known={k:0,p:0,f:0,c:0};for(const item of items){for(const a of ['k','p','f','c']){if(item[a]===null||item[a]===undefined||!Number.isFinite(Number(item[a]))){unknown[a]++;}else{v[a]+=Number(item[a]);known[a]++}}}return {v,unknown,known}}
function valueText(s,key,unit){if(!s.known[key])return '未計算';return `${nf(s.v[key],key==='k'?0:1)}${s.unknown[key]?'＋':''} ${unit}`}
function progress(v,target){if(!target||!Number.isFinite(v))return '';return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,v/target*100))}%"></i></div>`}
function metrics(s){return `<div class="two"><div class="metric"><div class="metric-label">エネルギー</div><div class="metric-val">${s.known.k?nf(s.v.k):'—'}<span class="metric-unit"> kcal${s.unknown.k?'＋':''}</span></div>${progress(s.v.k,settings.kTarget)}<div class="metric-sub">${settings.kTarget?'設定目安 '+nf(settings.kTarget)+' kcal':'目標は設定から登録'}${s.unknown.k?' · 未計算あり':''}</div></div><div class="metric"><div class="metric-label">たんぱく質</div><div class="metric-val">${s.known.p?nf(s.v.p,1):'—'}<span class="metric-unit"> g${s.unknown.p?'＋':''}</span></div>${progress(s.v.p,settings.pTarget)}<div class="metric-sub">${settings.pTarget?'設定目安 '+nf(settings.pTarget)+' g':'目標未設定'}${s.unknown.p?' · 未計算あり':''}</div></div><div class="metric"><div class="metric-label">脂質</div><div class="metric-val">${s.known.f?nf(s.v.f,1):'—'}<span class="metric-unit"> g${s.unknown.f?'＋':''}</span></div>${progress(s.v.f,settings.fTarget)}<div class="metric-sub">${settings.fTarget?'設定目安 '+nf(settings.fTarget)+' g':'目標未設定'}${s.unknown.f?' · 未計算あり':''}</div></div><div class="metric"><div class="metric-label">炭水化物</div><div class="metric-val">${s.known.c?nf(s.v.c,1):'—'}<span class="metric-unit"> g${s.unknown.c?'＋':''}</span></div>${progress(s.v.c,settings.cTarget)}<div class="metric-sub">${settings.cTarget?'設定目安 '+nf(settings.cTarget)+' g':'目標未設定'}${s.unknown.c?' · 未計算あり':''}</div></div></div>`}
function renderHome(){const daily=meals.filter(m=>m.date===day), items=daily.flatMap(m=>m.items),s=sums(items);let w=weights.filter(x=>x.id<=day).at(-1);return `<h1 class="greet">今日も、いい食事を。🌷</h1><p class="sub">完璧じゃなくて大丈夫。少しずつ記録を積み重ねよう。</p><div class="card"><div class="day-label"><span>📅 記録する日を選択</span><span>${daily.length} 件の食事</span></div><input style="margin-top:10px" type="date" id="home-date" value="${esc(day)}"></div><div class="section-title"><h2>🍀 ${dateLabel(day)}の栄養</h2><span class="tag">${MODES[settings.mode].label}モード</span></div>${metrics(s)}${items.length&&Object.values(s.unknown).some(Boolean)?'<div class="notice">未計算の食品があるため、表示は記録済み栄養値の合計です。「＋」は不足分があることを示します。</div>':''}<div class="section-title"><h2>🍽️ 食事の記録</h2><button class="secondary" data-action="nav" data-tab="add">＋ 食事を追加</button></div>${daily.length?daily.map(renderMealCard).join(''):'<div class="card empty">🥣<br><b>まだ食事の記録がありません</b><br>食べたものを気軽に追加してみよう！</div>'}<div class="section-title"><h2>📊 直近7日間の記録</h2></div><div class="card">${renderBars(day)}<p class="caption">棒の高さは入力済みエネルギーの目安です。未計算の食品は含まれません。</p></div><div class="section-title"><h2>⚖️ 体重記録</h2></div><div class="card"><div class="stack" style="margin-bottom:12px"><div><div class="metric-label">直近の体重</div><div class="metric-val">${w?nf(w.value,1):'—'} <span class="metric-unit">kg</span></div></div>${settings.weightTarget?`<span class="tag">目標 ${nf(settings.weightTarget,1)} kg</span>`:''}</div><div class="two"><input id="weight-value" type="number" step="0.1" min="1" max="500" placeholder="例：65.5" aria-label="体重 kg"><button class="secondary" data-action="save-weight">${dateLabel(day)}の体重を保存</button></div><p class="caption inline-note">体重は日々変動します。短期の数値だけで判断しないでね。</p></div><div class="section-title"><h2>✨ AIに食事を相談</h2></div>${renderAiCard()}`}
function renderBars(anchor){const d=new Date(`${anchor}T12:00:00`);const ds=[];for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(x.getDate()-i);const key=keyOf(x),s=sums(meals.filter(m=>m.date===key).flatMap(m=>m.items));ds.push({key,s})}const max=Math.max(1,...ds.map(x=>x.s.v.k));return `<div class="grid-days">${ds.map(x=>{const h=x.s.known.k?Math.max(6,Math.round(x.s.v.k/max*105)):4;return `<div class="daybar"><div class="column ${x.s.known.k?'has':''} ${x.key===today()?'today':''}" style="height:${h}px" title="${esc(dateLabel(x.key))}: ${x.s.known.k?nf(x.s.v.k)+' kcal':'未計算'}"></div><small>${+x.key.slice(-2)}日</small></div>`}).join('')}</div>`}
function renderMealCard(m){const s=sums(m.items),p=photoURL(m.photo),desc=m.items.map(x=>x.name).join('、');return `<div class="card"><div class="meal-layout"><div><div class="stack"><span class="tag">${esc(m.type)}</span><span class="tiny muted">${dateLabel(m.date)}</span></div><div class="item-name" style="margin-top:9px">${esc(desc||'食事')}</div><div class="item-desc">${valueText(s,'k','kcal')} · たんぱく質 ${valueText(s,'p','g')}</div>${m.note?`<div class="item-desc">📝 ${esc(m.note)}</div>`:''}</div>${p?`<img class="photo" src="${p}" alt="食事に添付した写真">`:''}</div><div class="stack" style="margin-top:13px"><button class="ghost small" data-action="copy-meal" data-id="${esc(m.id)}">内容をコピー</button><button class="item-btn danger small" data-action="delete-meal" data-id="${esc(m.id)}">削除 🗑</button></div></div>`}
function renderAiCard(){return `<div class="card"><p class="small muted" style="line-height:1.9;margin:0 0 13px">期間中の食事・栄養を相談文にまとめるよ。ChatGPTに貼り付ければ、目標に合わせたアドバイスがもらえる。</p><div class="seg range"><button data-action="ai-range" data-days="1" class="${aiRange===1?'active':''}">1日</button><button data-action="ai-range" data-days="7" class="${aiRange===7?'active':''}">7日</button><button data-action="ai-range" data-days="30" class="${aiRange===30?'active':''}">30日</button></div><div class="btn-row" style="margin-top:14px"><button class="primary" data-action="copy-ai">📋 相談文をコピー</button><button class="secondary" data-action="open-chatgpt">🤖 ChatGPTを開く</button></div><p class="caption inline-note">AIへの自動送信はしません。写真・体重データも、本人が選んで送る方式です。</p></div>`}
function renderAdd(){return `<h1 class="greet">🍱 食事を記録</h1><p class="sub">検索・自由入力・お気に入り・写真の4つに対応！</p><div class="card"><div class="two"><div class="field"><label class="label" for="meal-date">日付</label><input id="meal-date" type="date" value="${esc(addMealDate)}"></div><div class="field"><label class="label" for="meal-type">食事の種類</label><select id="meal-type">${['朝食','昼食','夕食','間食'].map(m=>`<option ${addMealType===m?'selected':''}>${m}</option>`).join('')}</select></div></div><label class="label">食品を追加する方法</label><div class="seg"><button data-action="method" data-method="search" class="${method==='search'?'active':''}">🔍 食品検索</button><button data-action="method" data-method="free" class="${method==='free'?'active':''}">✏️ 自由入力</button><button data-action="method" data-method="fav" class="${method==='fav'?'active':''}">⭐ お気に入り</button></div><div id="method-box" style="margin-top:17px">${renderMethod()}</div></div><div class="section-title"><h2>🛒 今回の食事 <span class="tiny muted">${draft.length} 品</span></h2></div><div class="card">${draft.length?draft.map((d,i)=>`<div class="item draft-row"><div><div class="item-name">${esc(d.name)} ${d.amount?'('+nf(d.amount)+'g)':''}</div><div class="item-desc">${d.k===null?'栄養値未計算':nf(d.k)+' kcal'} / P ${d.p===null?'—':nf(d.p,1)+'g'}</div></div><div class="btns"><button class="item-btn" title="お気に入りに保存" data-action="save-fav" data-i="${i}">☆</button><button class="item-btn danger" title="一覧から削除" data-action="remove-draft" data-i="${i}">×</button></div></div>`).join(''):'<div class="empty" style="padding:20px">まだ食品がありません。<br>上の入力欄から追加してね。</div>'}${draft.length?`<div class="preview"><div class="metric-label">現在の合計（未計算を除く）</div><div style="font-size:22px;font-weight:800">${valueText(sums(draft),'k','kcal')}</div><div class="small muted" style="margin-top:4px">P ${valueText(sums(draft),'p','g')} · F ${valueText(sums(draft),'f','g')} · C ${valueText(sums(draft),'c','g')}</div></div>`:''}</div><div class="section-title"><h2>📸 食事の写真</h2><span class="tiny muted">任意</span></div><div class="card"><label class="photo-label">📷 写真を撮る／ライブラリから選ぶ<input id="meal-photo" type="file" accept="image/*"></label><div id="photo-preview"></div><p class="caption">この初期版では写真も端末内に保存。栄養値を写真から自動推定する機能ではありません。</p></div><div class="card"><div class="field"><label class="label" for="meal-note">メモ（任意）</label><textarea id="meal-note" maxlength="1000" placeholder="例：家で作ったカレー。ご飯は少なめ。">${esc(addMealNote)}</textarea></div><button class="primary wide" data-action="save-meal" ${draft.length?'':'disabled'}>✓ この食事を保存する</button><p class="caption" style="margin-top:11px">保存した食事はホーム・履歴に表示されるよ。</p></div>`}
function renderMethod(){if(method==='search')return `<div class="field"><label class="label" for="food-query">食品名を検索</label><input id="food-query" placeholder="例：白米、納豆、鶏むね肉" value="${esc(searchText)}" autocomplete="off"><div id="search-results" style="max-height:200px;overflow:auto"></div></div><div class="field"><label class="label" for="food-grams">食べた量（g）</label><input type="number" id="food-grams" min="1" max="3000" step="1" value="150"></div><div id="search-preview"></div><button class="primary wide" data-action="add-search">＋ この食品を追加</button><p class="caption inline-note">検索食品の栄養値はサンプル概算値。実際の商品・調理法とは異なる場合があります。</p>`;
if(method==='free')return `<div class="field"><label class="label" for="free-name">料理・食品名</label><input id="free-name" maxlength="120" placeholder="例：唐揚げ定食、手作りカレー"></div><div class="notice">数字が分からなくても名前だけで記録OK！ 不明な数値は0ではなく「未計算」になります。栄養成分表示が分かる場合だけ入力してね。</div><div class="two"><div class="field"><label class="label" for="free-k">カロリー（kcal）</label><input id="free-k" type="number" min="0" step="0.1" placeholder="不明なら空欄"></div><div class="field"><label class="label" for="free-p">たんぱく質（g）</label><input id="free-p" type="number" min="0" step="0.1" placeholder="不明なら空欄"></div><div class="field"><label class="label" for="free-f">脂質（g）</label><input id="free-f" type="number" min="0" step="0.1" placeholder="不明なら空欄"></div><div class="field"><label class="label" for="free-c">炭水化物（g）</label><input id="free-c" type="number" min="0" step="0.1" placeholder="不明なら空欄"></div></div><button class="primary wide" data-action="add-free">＋ この料理を追加</button>`;
return `<p class="small muted">☆で保存したメニューをワンタップで追加できます。</p>${favs.length?favs.map(f=>`<div class="item stack"><div><div class="item-name">${esc(f.name)}</div><div class="item-desc">${f.amount?nf(f.amount)+'g · ':''}${f.k===null?'未計算':nf(f.k)+' kcal'}</div></div><div class="btn-row" style="flex:0 0 auto"><button class="secondary small" data-action="add-fav" data-id="${esc(f.id)}">＋ 追加</button><button class="item-btn danger" title="お気に入りを削除" data-action="delete-fav" data-id="${esc(f.id)}">×</button></div></div>`).join(''):'<div class="empty">お気に入りはまだありません。<br>食品を追加して☆を押してね。</div>'}`}
function renderSearchResults(){const root=$('search-results');if(!root)return;const q=searchText.replace(/[\s　]/g,'').toLowerCase();const arr=FOODS.filter(f=>f.name.replace(/[\s　]/g,'').toLowerCase().includes(q)).slice(0,12);if(!arr.some(f=>f.id===selFood))selFood=arr.length?arr[0].id:null;root.innerHTML=arr.length?arr.map(f=>`<button class="suggestion ${selFood===f.id?'active':''}" type="button" data-action="select-food" data-id="${f.id}"><span><strong>${esc(f.name)}</strong><br><small>${esc(f.group)}</small></span><small>${nf(f.k)} kcal/100g ${selFood===f.id?'✓':''}</small></button>`).join(''):'<p class="caption">該当する食品がありません。自由入力から登録できます。</p>'}
function updateSearchPreview(){const e=$('search-preview');if(!e)return;const f=FOODS.find(x=>x.id===selFood);const grams=validNumber($('food-grams')?.value);if(!f||!grams||grams>3000){e.innerHTML='<div class="notice">食品を選び、1〜3000gの範囲で入力してね。</div>';return}const r=grams/100;e.innerHTML=`<div class="preview"><div class="small">${esc(f.name)} · ${nf(grams)}g</div><strong>${nf(f.k*r)} <span class="small">kcal</span></strong><div class="small muted">P ${nf(f.p*r,1)} g　F ${nf(f.f*r,1)} g　C ${nf(f.c*r,1)} g</div></div>`}
function renderDraftPhoto(){const root=$('photo-preview');if(!root)return;if(photoPreviewUrl){root.innerHTML=`<img class="photo-large" alt="添付予定の食事写真" src="${photoPreviewUrl}" style="margin-top:12px"><button class="ghost wide" data-action="remove-photo" style="margin-top:7px">写真を外す</button>`}else root.innerHTML=''}
function renderHistory(){const dd=meals.filter(m=>m.date===historyDay);return `<h1 class="greet">📅 食事の履歴</h1><p class="sub">いつ何を食べたか、あとから確認できるよ。</p><div class="card"><label class="label" for="history-date">表示する日付</label><input id="history-date" type="date" value="${esc(historyDay)}"><div class="small muted" style="margin-top:12px">${dateLabel(historyDay)}：${dd.length} 件 / ${valueText(sums(dd.flatMap(m=>m.items)),'k','kcal')}</div></div>${dd.length?dd.map(renderMealCard).join(''):'<div class="card empty">この日の食事はまだ記録されていません。</div>'}<div class="section-title"><h2>すべての記録</h2><span class="tiny muted">合計 ${meals.length} 件</span></div><div class="card">${meals.length?meals.slice(0,40).map(m=>`<div class="item stack"><div><div class="item-name">${dateLabel(m.date)} · ${esc(m.type)}</div><div class="item-desc">${esc(m.items.map(x=>x.name).join('、'))}</div></div><button class="ghost small" data-action="jump-day" data-date="${esc(m.date)}">見る</button></div>`).join(''):'<div class="empty">記録が増えるとここに表示されます。</div>'}</div><div class="notice">端末のデータを消すと記録が失われる場合があります。設定から定期的にバックアップしてね。</div>`}
function renderSettings(){const v=k=>settings[k]??'';return `<h1 class="greet">⚙️ 設定</h1><p class="sub">目標はいつでも切り替えられるよ。記録はそのまま残ります。</p><div class="section-title"><h2>🎯 目標モード</h2></div><div class="card"><div class="goal-grid">${Object.entries(MODES).map(([k,m])=>`<button class="goal ${settings.mode===k?'active':''}" data-action="goal" data-mode="${k}"><span>${m.icon}</span><strong>${m.label} ${settings.mode===k?'✓':''}</strong><small>${m.sub}</small></button>`).join('')}</div><p class="caption">目標を切り替えても、食事・体重の記録は削除されません。</p></div><div class="section-title"><h2>📏 目標値（任意）</h2></div><div class="card"><div class="notice">個人に合う数値は年齢・身長・活動量・健康状態などで変わります。ここでは自動設定せず、無理のない目標を自分で入力してください。</div><div class="two"><div class="field"><label class="label" for="target-k">エネルギー（kcal/日）</label><input id="target-k" type="number" min="0" max="15000" placeholder="未設定" value="${esc(v('kTarget'))}"></div><div class="field"><label class="label" for="target-p">たんぱく質（g/日）</label><input id="target-p" type="number" min="0" max="1000" placeholder="未設定" value="${esc(v('pTarget'))}"></div><div class="field"><label class="label" for="target-f">脂質（g/日）</label><input id="target-f" type="number" min="0" max="1000" placeholder="未設定" value="${esc(v('fTarget'))}"></div><div class="field"><label class="label" for="target-c">炭水化物（g/日）</label><input id="target-c" type="number" min="0" max="1500" placeholder="未設定" value="${esc(v('cTarget'))}"></div><div class="field"><label class="label" for="target-w">目標体重（kg）</label><input id="target-w" type="number" min="0" max="500" step="0.1" placeholder="未設定" value="${esc(v('weightTarget'))}"></div></div><button class="primary wide" data-action="save-settings">目標値を保存</button></div><div class="section-title"><h2>💾 バックアップ</h2></div><div class="card"><p class="small muted">食事・写真・お気に入り・体重・設定をJSONファイルに保存できます。初期版はこの端末のブラウザだけに記録を保存します。</p><div class="btn-row"><button class="secondary" data-action="export">⬇️ 保存</button><button class="ghost" data-action="import-trigger">⬆️ 復元</button></div><input class="hide" type="file" id="import-file" accept="application/json,.json"><p class="caption" style="margin-top:12px">復元では同じIDの記録を上書きします。事前のバックアップをおすすめします。</p></div><div class="section-title"><h2>📚 食品成分データについて</h2></div><div class="card"><p class="small muted" style="line-height:1.9">現在の食品検索は使い方を確認するための簡易サンプルです。正式版では文部科学省の食品成分表などを使用して、食品コード・調理状態・出典を明示する予定です。</p><a href="https://fooddb.mext.go.jp/" target="_blank" rel="noopener noreferrer">文部科学省 食品成分データベース ↗</a></div><div class="notice">このアプリは食事記録の補助ツールです。栄養値は推定・概算を含み、診断・治療の代わりではありません。食事制限や体重の目標について心配がある場合は専門家に相談してください。</div>`}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function aiText(days=aiRange){const anchor=new Date(`${day}T12:00:00`);const start=new Date(anchor);start.setDate(anchor.getDate()-days+1);const startKey=keyOf(start),ms=meals.filter(m=>m.date>=startKey&&m.date<=day);const byDate=[...new Set(ms.map(m=>m.date))].sort();let s=`MEAL PARTNERから食生活の相談です。\n目的：${MODES[settings.mode].label}\n期間：${startKey} ～ ${day}（${days}日間）\n`;if(settings.kTarget)s+=`目安エネルギー：${settings.kTarget}kcal/日\n`;if(settings.pTarget)s+=`目安たんぱく質：${settings.pTarget}g/日\n`;s+='\n';for(const date of byDate){const entries=ms.filter(m=>m.date===date);const total=sums(entries.flatMap(m=>m.items));s+=`【${date}】合計：${valueText(total,'k','kcal')}、P ${valueText(total,'p','g')}、F ${valueText(total,'f','g')}、C ${valueText(total,'c','g')}\n`;for(const m of entries){s+=`・${m.type}：${m.items.map(x=>`${x.name}${x.amount?' '+x.amount+'g':''}${x.k===null?'（栄養未計算）':''}`).join('、')}${m.note?'｜メモ:'+m.note:''}\n`}}if(!ms.length)s+='期間中の食事記録なし。\n';s+='\n記録のない日や栄養未計算の食品は摂取ゼロを意味しません。表示値は概算を含みます。\nこの記録から分かる範囲で、食事の傾向・不足しがちな栄養・無理のない改善案を優しく提案して。情報不足なら推測と事実を区別して教えて。過度なカロリー制限や罪悪感をあおる指導は避けてください。';return s}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('コピーしたよ！ ChatGPTに貼り付けてね 🌿')}catch(_){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'コピーしたよ！':'コピーできませんでした。HTTPSで公開して試してね。')}}
async function optimizePhoto(file){if(!file.type.startsWith('image/'))throw Error('画像ファイルを選んでください。');if(file.size>25*1024*1024)throw Error('写真は25MB以内にしてください。');const bitmap=await createImageBitmap(file).catch(()=>null);if(!bitmap){return file.size<=2*1024*1024?file:Promise.reject(Error('この画像形式を読み込めませんでした。'))}const scale=Math.min(1,1280/Math.max(bitmap.width,bitmap.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*scale));cv.height=Math.max(1,Math.round(bitmap.height*scale));cv.getContext('2d').drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close?.();const b=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.8));if(!b)throw Error('写真を変換できませんでした。');return b}
function clearPhoto(){if(photoPreviewUrl)URL.revokeObjectURL(photoPreviewUrl);photoPreviewUrl=null;photoBlob=null}
async function changePhoto(file){if(!file)return;try{const blob=await optimizePhoto(file);clearPhoto();photoBlob=blob;photoPreviewUrl=URL.createObjectURL(blob);renderDraftPhoto();toast('写真を追加したよ 📸')}catch(e){toast(e.message||'画像を読み込めませんでした')}}
function blobDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
async function exportAll(){toast('バックアップを準備中...');const packed=[];for(const m of meals){packed.push({...m,photo:m.photo?await blobDataUrl(m.photo):null})}const out={type:'meal-partner-backup',version:1,exportedAt:new Date().toISOString(),meals:packed,favorites:favs,weights,settings};const link=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));link.href=url;link.download=`meal-partner-backup-${today()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('バックアップファイルを作成したよ 💾')}
function dataURLBlob(str){const m=/^data:(image\/(?:jpeg|png|webp|gif));base64,([A-Za-z0-9+/=]+)$/.exec(str||'');if(!m)throw Error('写真データの形式が正しくありません');const raw=atob(m[2]);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:m[1]})}
async function importAll(file){if(!file)return;try{if(file.size>80*1024*1024)throw Error('ファイルが大きすぎます');const b=JSON.parse(await file.text());if(b.type!=='meal-partner-backup'||b.version!==1||!Array.isArray(b.meals)||!Array.isArray(b.favorites)||!Array.isArray(b.weights)||!b.settings)throw Error('MEAL PARTNERのバックアップではありません');if(!confirm(`食事${b.meals.length}件・お気に入り${b.favorites.length}件を復元します。同じIDの記録は上書きします。続けますか？`))return;for(const mm of b.meals){if(!mm.id||!Array.isArray(mm.items)||!/\d{4}-\d{2}-\d{2}/.test(mm.date))continue;const x={...mm,photo:typeof mm.photo==='string'?dataURLBlob(mm.photo):null};await storeOp('meals','put',x)}for(const f of b.favorites)if(f.id&&f.name)await storeOp('favorites','put',f);for(const w of b.weights)if(w.id&&Number.isFinite(+w.value))await storeOp('weights','put',w);if(b.settings.id==='prefs'&&MODES[b.settings.mode])await storeOp('settings','put',b.settings);await refresh();render();toast('バックアップを復元したよ！')}catch(e){toast('復元できませんでした：'+(e.message||e))}}
function saveFavoriteFromDraft(i){const d=draft[i];if(!d)return;const f={...d,id:id()};return storeOp('favorites','put',f).then(async()=>{await refresh();toast('お気に入りに保存したよ ⭐')})}
async function handleClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;try{
if(a==='nav'){go(btn.dataset.tab);return}
if(a==='goal'){settings.mode=btn.dataset.mode;await storeOp('settings','put',settings);render();toast(`${MODES[settings.mode].label}モードに変更したよ`);return}
if(a==='method'){method=btn.dataset.method;render();return}
if(a==='select-food'){selFood=Number(btn.dataset.id);renderSearchResults();updateSearchPreview();return}
if(a==='add-search'){const f=FOODS.find(x=>x.id===selFood),g=validNumber($('food-grams').value);if(!f||!g||g>3000){toast('食品と1〜3000gの量を選んでね');return}const x=g/100;draft.push({id:id(),name:f.name,amount:g,k:round1(f.k*x),p:round1(f.p*x),f:round1(f.f*x),c:round1(f.c*x),source:'sample'});render();toast('食品を追加したよ 🍚');return}
if(a==='add-free'){const name=$('free-name').value.trim();if(!name){toast('料理・食品名を入力してね');return}const vals={};for(const prop of ['k','p','f','c']){const raw=$('free-'+prop).value;if(raw!==''&&(Number(raw)<0||!Number.isFinite(+raw))){toast('栄養値は0以上の数字で入力してね');return}vals[prop]=validNumber(raw)}draft.push({id:id(),name,amount:null,...vals,source:'manual'});render();toast('料理を追加したよ ✏️');return}
if(a==='add-fav'){const f=favs.find(x=>x.id===btn.dataset.id);if(f){draft.push({...f,id:id()});render();toast('お気に入りを追加したよ ⭐')}return}
if(a==='save-fav'){await saveFavoriteFromDraft(Number(btn.dataset.i));return}
if(a==='delete-fav'){if(confirm('このお気に入りを削除しますか？')){await storeOp('favorites','delete',btn.dataset.id);await refresh();render();toast('お気に入りを削除したよ')}return}

if(a==='save-meal'){if(!draft.length){toast('食品を1つ以上追加してね');return}const mealDate=addMealDate,mealType=addMealType,note=addMealNote.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(mealDate)){toast('日付を選んでね');return}btn.disabled=true;const m={id:id(),date:mealDate,type:mealType,note,items:structuredClone(draft),photo:photoBlob,created:new Date().toISOString()};await storeOp('meals','put',m);await refresh();draft=[];day=mealDate;historyDay=mealDate;addMealDate=today();addMealType='昼食';addMealNote='';clearPhoto();go('home');toast('食事を保存したよ！ 🌱');return}
if(a==='delete-meal'){if(confirm('この食事記録を削除しますか？')){await storeOp('meals','delete',btn.dataset.id);await refresh();render();toast('食事記録を削除したよ')}return}
if(a==='copy-meal'){const m=meals.find(x=>x.id===btn.dataset.id);if(m)await copyText(`${m.date} ${m.type}\n${m.items.map(x=>`・${x.name}${x.amount?' '+x.amount+'g':''}`).join('\n')}${m.note?'\nメモ:'+m.note:''}`);return}
if(a==='jump-day'){historyDay=btn.dataset.date;render();window.scrollTo({top:0,behavior:'smooth'});return}
if(a==='ai-range'){aiRange=Number(btn.dataset.days);render();return}
if(a==='copy-ai'){await copyText(aiText());return}
if(a==='open-chatgpt'){window.open('https://chatgpt.com/','_blank','noopener,noreferrer');return}
if(a==='save-weight'){const v=validNumber($('weight-value').value);if(!v||v>500){toast('体重をkgで入力してね');return}await storeOp('weights','put',{id:day,value:v});await refresh();render();toast('体重を保存したよ ⚖️');return}
if(a==='save-settings'){const pairs=[['kTarget','target-k',15000],['pTarget','target-p',1000],['fTarget','target-f',1000],['cTarget','target-c',1500],['weightTarget','target-w',500]];for(const [k,el,max] of pairs){const raw=$(el).value,v=validNumber(raw);if(raw!==''&&(v===null||v>max)){toast('目標値の入力を確認してね');return}settings[k]=v}await storeOp('settings','put',settings);render();toast('目標値を保存したよ ✓');return}
if(a==='export'){await exportAll();return}
if(a==='import-trigger'){$('import-file').click();return}
}catch(err){console.error(err);toast('処理できませんでした：'+(err.message||'不明なエラー'))}}

    if(plan.duplicate){toast('同じ補完データは反映済みだよ ✓');return}
    if(!plan.patches.length&&!plan.noteChanges.length)throw new Error('更新できる食品・アドバイスがありません（すでに計算済みの場合があります）');
    const log={id:plan.id,created:new Date().toISOString(),patches:plan.patches,dictIds:plan.dictChanges.map(x=>x.id),noteIds:plan.noteChanges.map(x=>x.id)};
    await commitTransaction(['meals','userFoods','aiNotes','aiImports'],tx=>{
      for(const m of plan.changedMeals.values())tx.objectStore('meals').put(m);
      for(const f of plan.dictChanges)tx.objectStore('userFoods').put(f);
      for(const n of plan.noteChanges)tx.objectStore('aiNotes').put(n);
      tx.objectStore('aiImports').put(log);
    });
    await refresh();render();
    toast('補完'+plan.patches.length+'品・アドバイス'+plan.noteChanges.length+'件を保存したよ ✨');
  }
  async function undoLatestAi(){
    const log=aiImports[aiImports.length-1];if(!log){toast('取り消せる補完がないよ');return}
    if(!confirm('直前のAI補完を取り消しますか？後から編集した食品値は上書きせず残します。'))return;
    const changed=new Map();
    for(const p of log.patches){
      const m=meals.find(x=>x.id===p.mealId);if(!m)continue;
      const entry=(changed.get(m.id)||m).items.find(x=>x.id===p.itemId);
      if(!entry||entry.aiMeta?.importId!==log.id)continue;
      if(!Object.entries(p.after).every(([k,v])=>entry[k]===v))continue;
      const restore={...entry};
      for(const [k,v] of Object.entries(p.before))restore[k]=v;
      if(p.originalMeta)restore.aiMeta=p.originalMeta;else delete restore.aiMeta;
      if(p.originalSource!==null)restore.source=p.originalSource;else delete restore.source;
      const updated=changed.get(m.id)||{...m,items:m.items.map(x=>({...x}))};
      updated.items=updated.items.map(x=>x.id===p.itemId?restore:x);
      changed.set(m.id,updated);
    }
    await commitTransaction(['meals','userFoods','aiNotes','aiImports'],tx=>{
      for(const m of changed.values())tx.objectStore('meals').put(m);
      for(const did of log.dictIds){const f=userFoods.find(x=>x.id===did);if(f?.sourceImport===log.id&&!f.userEdited)tx.objectStore('userFoods').delete(did)}
      for(const nid of log.noteIds)tx.objectStore('aiNotes').delete(nid);
      tx.objectStore('aiImports').delete(log.id);
    });
    await refresh();render();toast('直前の補完を取り消したよ ↩');
  }
  const numberToSave=(id,k)=>{
    const v=$(id)?.value?.trim();
    if(v==='')return null;
    return safeNum(Number(v),k);
  };
  document.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-action]');if(!btn)return;
    const act=btn.dataset.action;
    if(act==='select-food'){selectedUserFood=null;return}
    const handled=['ai-scope','ai-import','ai-undo','pick-dict-food','add-search','dict-edit','dict-save','dict-delete'];
    if(!handled.includes(act))return;
    if(act==='add-search'&&!selectedUserFood)return;
    e.preventDefault();e.stopImmediatePropagation();
    try{
      if(act==='ai-scope'){aiScope=btn.dataset.scope;aiRange=aiScope==='week'?7:1;render();return}
      if(act==='ai-import'){
        const raw=$('ai-json')?.value||'';
        if(!raw.trim()){toast('ChatGPTのJSONを貼り付けてね');return}
        btn.disabled=true;
        try{await importAi(raw)}finally{btn.disabled=false}
        return;
      }
      if(act==='ai-undo'){await undoLatestAi();return}
      if(act==='pick-dict-food'){
        selectedUserFood=btn.dataset.id;
        const f=userFoods.find(x=>x.id===selectedUserFood);
        const grams=$('food-grams');if(grams&&f)grams.value=f.unit==='serving'?1:f.defaultGrams||100;
        renderSearchResults();updateSearchPreview();return;
      }
      if(act==='add-search'){
        const f=userFoods.find(x=>x.id===selectedUserFood),qty=validNumber($('food-grams')?.value);
        if(!f||!qty||qty>3000){toast('食品の量を入力してね');return}
        const ratio=f.unit==='serving'?qty:qty/100;
        const vals=Object.fromEntries(['k','p','f','c'].map(k=>[k,f[k]==null?null:round1(f[k]*ratio)]));
        draft.push({id:id(),name:f.name,amount:f.unit==='serving'?null:qty,servings:f.unit==='serving'?qty:null,
          ...vals,source:'dictionary',dictionaryId:f.id});
        render();toast('マイ食品辞典から追加したよ 📚');return;
      }
      if(act==='dict-edit'){editingUserFood=btn.dataset.id;render();return}
      if(act==='dict-save'){
        const f=userFoods.find(x=>x.id===btn.dataset.id);if(!f)throw new Error('食品が見つかりません');
        const values=Object.fromEntries(['k','p','f','c'].map(k=>[k,numberToSave('dict-'+k,k)]));
        await storeOp('userFoods','put',{...f,...values,userEdited:true,updated:new Date().toISOString()});
        editingUserFood=null;await refresh();render();toast('マイ食品辞典を修正したよ ✓');return;
      }
      if(act==='dict-delete'){
        const f=userFoods.find(x=>x.id===btn.dataset.id);if(!f)return;
        if(!confirm('食品辞典から削除しますか？過去の食事記録は消えません。'))return;
        await storeOp('userFoods','delete',f.id);editingUserFood=null;selectedUserFood=null;
        await refresh();render();toast('食品辞典から削除したよ');return;
      }
    }catch(err){console.error(err);toast('取り込みできませんでした：'+(err.message||'不明なエラー'))}
  },true);
  // JSON backups include all new stores; older version 1 files remain restorable.
  exportAll=async function(){
    toast('バックアップを準備中...');
    const originals=[];
    for(const m of meals)originals.push({...m,photo:m.photo?await blobDataUrl(m.photo):null});
    const b={type:'meal-partner-backup',version:2,exportedAt:new Date().toISOString(),
      meals:originals,favorites:favs,weights,settings,userFoods,aiNotes,aiImports};
    const anchor=document.createElement('a');
    const url=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)],{type:'application/json'}));
    anchor.href=url;anchor.download='meal-partner-backup-'+today()+'.json';document.body.appendChild(anchor);anchor.click();anchor.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);toast('すべての記録のバックアップを作成したよ 💾');
  };
  importAll=async function(file){
    if(!file)return;
    try{
      if(file.size>100*1024*1024)throw new Error('バックアップが大きすぎます');
      const b=JSON.parse(await file.text());
      if(b.version===1){await baseImportAll(file);return}
      if(b.type!=='meal-partner-backup'||b.version!==2||!Array.isArray(b.meals)||!Array.isArray(b.favorites)||!Array.isArray(b.weights)||!b.settings||
      !Array.isArray(b.userFoods)||!Array.isArray(b.aiNotes)||!Array.isArray(b.aiImports))throw new Error('MEAL PARTNER用のバックアップではありません');
      if(!confirm('バックアップの内容を復元します。同じIDのデータは上書きされます。続けますか？'))return;
      const restoreMeals=b.meals.filter(m=>m&&typeof m.id==='string'&&dateOk(m.date)&&Array.isArray(m.items))
      .map(m=>({...m,photo:typeof m.photo==='string'?dataURLBlob(m.photo):null}));
      await commitTransaction(['meals','favorites','weights','settings','userFoods','aiNotes','aiImports'],tx=>{
        for(const m of restoreMeals)tx.objectStore('meals').put(m);
        for(const f of b.favorites)if(f?.id&&f.name)tx.objectStore('favorites').put(f);
        for(const w of b.weights)if(w?.id&&Number.isFinite(+w.value))tx.objectStore('weights').put(w);
        if(b.settings.id==='prefs'&&MODES[b.settings.mode])tx.objectStore('settings').put(b.settings);
        for(const x of b.userFoods)if(x?.id&&x.name)tx.objectStore('userFoods').put(x);
        for(const x of b.aiNotes)if(x?.id&&dateOk(x.date))tx.objectStore('aiNotes').put(x);
        for(const x of b.aiImports)if(x?.id&&Array.isArray(x.patches))tx.objectStore('aiImports').put(x);
      });
      await refresh();render();toast('新しい形式のバックアップを復元したよ ✓');
    }catch(err){console.error(err);toast('復元できませんでした：'+(err.message||err))}
  };
  const oldSettingsAfter=renderSettings;
  renderSettings=function(){
    return oldSettingsAfter().replace('初期版はこの端末のブラウザだけに記録を保存します。','食事・写真・体重・AIアドバイス・マイ食品辞典をすべて保存できます。同期機能はまだないので、定期的にバックアップしてね。');
  };
})();
// MP_V3_EXTENSION_POINT
})();

document.addEventListener('change',async e=>{if(e.target.id==='meal-date'){addMealDate=e.target.value}else if(e.target.id==='meal-type'){addMealType=e.target.value}else if(e.target.id==='home-date'){day=e.target.value;render()}else if(e.target.id==='history-date'){historyDay=e.target.value;render()}else if(e.target.id==='meal-photo'){await changePhoto(e.target.files?.[0])}else if(e.target.id==='import-file'){await importAll(e.target.files?.[0]);e.target.value=''}});
(async()=>{try{db=await dbOpen();await refresh();render()}catch(e){console.error(e);$('app').innerHTML=`<div class="card"><h2>保存機能を開けませんでした</h2><p>このブラウザではIndexedDBが利用できないようです。Safari・ChromeでGitHub Pagesの公開URLから開いてください。プライベートモードや保存制限も確認してください。</p><p class="caption">${esc(e.message||'')}</p></div>`}})();
